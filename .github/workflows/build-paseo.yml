name: Build Paseo Custom Image

on:
  push:
    branches: [ "main" ]
    paths:
      - 'paseo-custom/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
    steps:
      - name: Ottieni le ultime versioni di Paseo e di tutti gli agenti
        id: get-versions
        run: |
          set -euo pipefail

          # La versione di Paseo viene letta direttamente dal registro GHCR:
          # il repository GitHub getpaseo/paseo non e' pubblico e le API
          # releases/commits restituiscono sempre "null".
          GHCR_TOKEN=$(curl -sf "https://ghcr.io/token?scope=repository:getpaseo/paseo:pull&service=ghcr.io" | jq -r '.token')
          PASEO_VER=$(curl -sfI \
            -H "Authorization: Bearer $GHCR_TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            https://ghcr.io/v2/getpaseo/paseo/manifests/latest \
            | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')

          if [ -z "$PASEO_VER" ] || [ "$PASEO_VER" == "null" ]; then
            echo "::error::Impossibile determinare il digest di ghcr.io/getpaseo/paseo:latest"
            exit 1
          fi

          npm_version() {
            VER=$(curl -sf "https://registry.npmjs.org/$1/latest" | jq -r '.version')
            if [ -z "$VER" ] || [ "$VER" == "null" ]; then
              echo "::error::Impossibile determinare la versione npm di $1" >&2
              exit 1
            fi
            echo "$VER"
          }

          CLAUDE_VER=$(npm_version '@anthropic-ai/claude-code')
          CODEX_VER=$(npm_version '@openai/codex')
          OPENCODE_VER=$(npm_version 'opencode-ai')
          PI_VER=$(npm_version '@earendil-works/pi-coding-agent')

          COMBINED_STR="paseo:$PASEO_VER|claude:$CLAUDE_VER|codex:$CODEX_VER|opencode:$OPENCODE_VER|pi:$PI_VER"
          VERSION_HASH=$(echo -n "$COMBINED_STR" | sha256sum | cut -d' ' -f1)

          echo "Versioni rilevate: $COMBINED_STR"
          echo "hash=$VERSION_HASH" >> $GITHUB_OUTPUT

      - name: Controlla la cache delle versioni precedenti
        id: cache-version
        uses: actions/cache@v4
        with:
          path: .last_deps_hash
          key: paseo-deps-${{ steps.get-versions.outputs.hash }}

      - name: Determina se procedere con la build
        id: compare
        run: |
          if [ "${{ steps.cache-version.outputs.cache-hit }}" == "true" ] && [ "${{ github.event_name }}" == "schedule" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "${{ steps.get-versions.outputs.hash }}" > .last_deps_hash
          fi

  build-and-push:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del tuo repository
        uses: actions/checkout@v4

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Accedi al Registro di GitHub (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Estrai il comando di avvio originale di Paseo
        id: base-info
        run: |
          docker pull ghcr.io/getpaseo/paseo:latest
          ENTRYPOINT_PART=$(docker inspect --format='{{if .Config.Entrypoint}}{{range .Config.Entrypoint}}{{.}} {{end}}{{end}}' ghcr.io/getpaseo/paseo:latest)
          CMD_PART=$(docker inspect --format='{{if .Config.Cmd}}{{range .Config.Cmd}}{{.}} {{end}}{{end}}' ghcr.io/getpaseo/paseo:latest)
          COMBINED_CMD=$(echo "$ENTRYPOINT_PART $CMD_PART" | xargs)
          echo "base_cmd=$COMBINED_CMD" >> $GITHUB_OUTPUT

      - name: Converti il nome del repository in minuscolo
        id: repo-name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Costruisci e Pubblica l'immagine
        uses: docker/build-push-action@v6
        with:
          context: ./paseo-custom
          file: ./paseo-custom/Dockerfile
          push: true
          # Disattiva le attestazioni buildx: rigenerandosi a ogni build
          # cambierebbero il digest dell'index OCI anche quando i layer sono
          # identici, facendo ricreare inutilmente il container a watchtower.
          provenance: false
          sbom: false
          build-args: |
            BASE_DEFAULT_CMD=${{ steps.base-info.outputs.base_cmd }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}/paseo-custom:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
